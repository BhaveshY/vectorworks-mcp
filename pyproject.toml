[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorworks-mcp"
version = "0.7.0"
description = "Agent-ready MCP server and native/Python Vectorworks bridge for Vectorworks 2024/2025."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastmcp==4.0.3",
  "mcp==2.2.0",
  "pydantic==2.13.5",
]

[project.scripts]
vectorworks-mcp = "server:main"

[tool.setuptools]
py-modules = ["server", "vw_listener"]
