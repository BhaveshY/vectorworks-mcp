name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-vectorworks:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      STANDALONE_PLUGIN_TOKEN: ${{ secrets.VECTORWORKS_CLAUDE_PLUGIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify dependency lock
        shell: powershell
        run: |
          python -m pip install uv==0.12.10
          uv pip compile pyproject.toml --universal --generate-hashes --python-version 3.10 --no-python-downloads --output-file requirements.lock
          git diff --exit-code -- requirements.lock
          if ($LASTEXITCODE -ne 0) { throw "Dependency lock is out of date" }
      - name: Native transport regression tests
        shell: powershell
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsRoot) { throw "Visual C++ build tools are required" }
          $devCmd = Join-Path $vsRoot "Common7\Tools\VsDevCmd.bat"
          & cmd.exe /d /c "`"$devCmd`" -arch=x64 -host_arch=x64 && powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\test-native-bridge-scaffold.ps1 -RequireCompiler"
          if ($LASTEXITCODE -ne 0) { throw "Native transport regression failed" }
      - name: No-Vectorworks verification
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-no-vectorworks.ps1
      - name: Checkout standalone plugin companion
        id: checkout-standalone-plugin
        uses: actions/checkout@v4
        if: ${{ env.STANDALONE_PLUGIN_TOKEN != '' }}
        with:
          repository: BhaveshY/vectorworks-claude-plugin
          path: vectorworks-claude-plugin
          token: ${{ env.STANDALONE_PLUGIN_TOKEN }}
      - name: Standalone plugin companion contract
        if: steps.checkout-standalone-plugin.outcome == 'success'
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\vectorworks-claude-plugin\scripts\check-companion-contract.ps1 -RepoPath "${{ github.workspace }}"
      - name: Standalone plugin companion unavailable
        if: steps.checkout-standalone-plugin.outcome != 'success'
        shell: powershell
        run: Write-Warning "Skipping standalone plugin companion contract because VECTORWORKS_CLAUDE_PLUGIN_TOKEN is not configured. The standalone plugin repository validates the same companion contract in its own CI."
      - name: Bundled plugin contract
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\check-bundled-plugin-contract.ps1
      - name: Bundled plugin mirror drift
        if: steps.checkout-standalone-plugin.outcome == 'success'
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\check-bundled-plugin-contract.ps1 -StandalonePluginPath .\vectorworks-claude-plugin
