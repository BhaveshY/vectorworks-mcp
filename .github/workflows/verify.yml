name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-vectorworks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependency lock is current
        shell: powershell
        run: |
          python -m pip install uv==0.12.10
          uv pip compile pyproject.toml --universal --generate-hashes --python-version 3.10 --no-python-downloads --output-file requirements.lock
          git diff --exit-code -- requirements.lock
          if ($LASTEXITCODE -ne 0) { throw "requirements.lock is out of date" }
      - name: No-Vectorworks verification (parse, compileall, repair server, registration fixtures, plugin contract, skill tool names, host e2e vs mock bridge, sandbox install/uninstall)
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-no-vectorworks.ps1 -Python (Get-Command python).Source
      - name: Release package builds
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\package-release.ps1 -OutDir "$env:RUNNER_TEMP\dist"
